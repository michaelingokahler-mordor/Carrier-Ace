<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$GODOT_PROJECT_NAME</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#061e2c;color:#e4c47f;font-family:system-ui,sans-serif;overflow:hidden}
#canvas{display:block;width:100%;height:100%;outline:0}
#status{position:fixed;inset:0;display:grid;place-content:center;gap:18px;text-align:center;background:#0d2c3e;z-index:3}
#status strong{font-size:40px;letter-spacing:8px}progress{width:280px;accent-color:#e4c47f;margin:auto}
#notice{max-width:600px;white-space:pre-wrap;color:#f0e3c5}
#verification{position:fixed;bottom:0;left:0;right:0;margin:0;padding:8px;background:#000c;color:#a3f3b9;font:11px monospace;white-space:pre-wrap;pointer-events:none}
[hidden]{display:none!important}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Carrier Ace – Arcade Flight Game">JavaScript and WebGL 2 are required.</canvas>
<div id="status"><strong>CARRIER ACE</strong><div>Preparing flight clearance …</div><progress id="progress"></progress><div id="notice"></div></div>
<pre id="verification" hidden aria-live="polite"></pre>
<noscript>Please enable JavaScript.</noscript>
<script src="$GODOT_URL"></script>
<script>
const config=$GODOT_CONFIG;
config.onExit=()=>{const screen=document.createElement('div');screen.id='status';const title=document.createElement('strong');title.textContent='FLIGHT ENDED';const text=document.createElement('div');text.textContent='The game and its audio have stopped.';const restart=document.createElement('button');restart.textContent='Return to Carrier Ace';restart.onclick=()=>location.reload();screen.append(title,text,restart);document.body.append(screen);restart.focus();};
const engine=new Engine(config);
const status=document.getElementById('status');
const fail=error=>{document.getElementById('notice').textContent='The game could not start. Use a current browser with WebGL 2 and open the game through the included local server.\n'+String(error);console.error(error);};
const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
if(missing.length)fail(missing.join(', '));
else engine.startGame({onProgress:(current,total)=>{const p=document.getElementById('progress');if(total){p.max=total;p.value=current;}}}).then(()=>{status.remove();document.getElementById('canvas').focus();},fail);
</script>
</body>
</html>
